<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f2a44">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>名刺管理</title>
<style>
  :root { --navy:#1f2a44; --navy2:#34456e; --bg:#f4f5f8; --line:#d9dce3; --muted:#6b7280; --warn:#b45309; --red:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:#111; font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:var(--navy); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header button { background:none; border:1px solid #fff6; color:#fff; border-radius:8px; padding:6px 10px; font-size:14px; }
  main { padding:12px; max-width:640px; margin:0 auto; }
  .view { display:none; } .view.on { display:block; }
  input, textarea, select { width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:70px; }
  details { margin-top:14px; } summary { color:var(--navy); font-size:14px; padding:6px 0; }
  label.f { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; }
  .btn { display:block; width:100%; padding:13px; font-size:16px; border:none; border-radius:10px; background:var(--navy); color:#fff; margin-top:12px; }
  .btn.sub { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  .btn.danger { background:#fff; color:var(--red); border:1px solid var(--red); }
  .btn:disabled { opacity:.5; }
  .row2 { display:flex; gap:8px; } .row2 > * { flex:1; }
  .search { position:sticky; top:52px; z-index:4; background:var(--bg); padding-bottom:8px; }
  .count { font-size:12px; color:var(--muted); margin:4px 2px 8px; }
  .item { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .item .n { font-weight:600; } .item .c { font-size:14px; color:#333; } .item .d { font-size:12px; color:var(--muted); }
  .shot { border:2px dashed var(--line); border-radius:10px; background:#fff; text-align:center; padding:14px; margin-top:10px; position:relative; }
  .shot img { max-width:100%; max-height:220px; border-radius:6px; display:block; margin:0 auto; }
  .shot input { position:absolute; inset:0; opacity:0; }
  .shot .lbl { color:var(--navy); font-weight:600; }
  .note { font-size:13px; padding:10px; border-radius:8px; margin-top:10px; }
  .note.warn { background:#fef3c7; color:var(--warn); }
  .note.info { background:#e8ecf6; color:var(--navy); }
  .det h2 { margin:6px 0 2px; font-size:22px; } .det .kana { color:var(--muted); font-size:13px; }
  .det .co { margin-top:6px; }
  .kv { background:#fff; border:1px solid var(--line); border-radius:10px; margin-top:12px; }
  .kv div { padding:10px 12px; border-top:1px solid var(--line); } .kv div:first-child { border-top:none; }
  .kv .k { font-size:11px; color:var(--muted); display:block; } .kv a { color:var(--navy2); word-break:break-all; }
  .imgs img { width:100%; border-radius:8px; margin-top:10px; border:1px solid var(--line); }
  #editImg img { width:auto; max-width:100%; max-height:180px; display:block; margin:10px auto 0; }
  .tag { display:inline-block; background:#e8ecf6; color:var(--navy); border-radius:20px; padding:2px 9px; font-size:12px; margin:2px 4px 0 0; }
  #busy { position:fixed; inset:0; background:#0006; z-index:20; display:none; align-items:center; justify-content:center; color:#fff; font-size:16px; }
  #busy.on { display:flex; }
  .fab { position:fixed; right:18px; bottom:22px; z-index:6; width:62px; height:62px; border-radius:50%; background:var(--navy); color:#fff; border:none; font-size:28px; box-shadow:0 4px 12px #0004; }
</style>
</head>
<body>
<header>
  <h1 id="title">名刺管理</h1>
  <button id="backBtn" style="display:none" onclick="goList()">一覧へ</button>
</header>

<main>
  <!-- 初回設定 -->
  <section id="v-setup" class="view">
    <div class="note info">初回だけ設定が必要です。パソコンの Apps Script で showLink() を実行して出たリンクを、このスマホで開いてください。</div>
    <label class="f">または、そのリンクをここに貼り付け</label>
    <textarea id="setupLink" placeholder="https://moveo-niigata.github.io/jisshi/meishi/#u=...&k=..."></textarea>
    <button class="btn" onclick="setupFromText()">設定する</button>
  </section>

  <!-- 一覧 -->
  <section id="v-list" class="view on">
    <div class="search">
      <input id="q" type="search" placeholder="名前・会社・メモで検索" oninput="renderList()">
      <div class="count" id="count">読み込み中…</div>
    </div>
    <div id="list"></div>
    <div style="height:80px"></div>
  </section>

  <!-- 撮影 -->
  <section id="v-shot" class="view">
    <div class="shot" id="shotFront">
      <div class="lbl">📷 表面を撮る</div><div class="d" style="font-size:12px;color:#6b7280">名刺を画面いっぱいに・まっすぐ</div>
      <input type="file" accept="image/*" capture="environment" onchange="pick(event,'front')">
    </div>
    <div class="shot" id="shotBack">
      <div class="lbl">裏面も撮る（任意）</div>
      <input type="file" accept="image/*" capture="environment" onchange="pick(event,'back')">
    </div>
    <button class="btn" id="readBtn" onclick="readCard()" disabled>読み取る</button>
    <button class="btn sub" onclick="manualEntry()">写真なしで手入力する</button>
  </section>

  <!-- 確認・編集 -->
  <section id="v-edit" class="view">
    <div id="editNotes"></div>
    <div id="editImg" class="imgs"></div>
    <form id="form" onsubmit="return false"></form>
    <button class="btn" onclick="save()">保存する</button>
    <button class="btn sub" onclick="cancelEdit()">やめる</button>
    <div style="height:30px"></div>
  </section>

  <!-- 詳細 -->
  <section id="v-det" class="view det">
    <div id="det"></div>
    <div class="row2">
      <button class="btn sub" onclick="editCurrent()">編集</button>
      <button class="btn sub" onclick="vcard()">連絡先に追加</button>
    </div>
    <div id="detImgs" class="imgs"></div>
    <button class="btn danger" onclick="del()">この名刺を削除</button>
    <div style="height:30px"></div>
  </section>
</main>

<button class="fab" id="fab" onclick="goShot()" aria-label="名刺を追加">＋</button>
<div id="busy"><span id="busyMsg">処理中…</span></div>

<script>
var FIELDS = [
  ['name','氏名'], ['company','会社・団体'], ['department','部署・事業所'], ['title','役職'],
  ['tel','電話','tel'], ['mobile','携帯','tel'], ['email','メール','email'],
  ['memo','メモ（どこで会った・何の件）','area'], ['exchanged','交換日','date'],
  ['kana','ふりがな','',1], ['fax','FAX','tel',1], ['zip','郵便番号','',1], ['address','住所','',1],
  ['url','URL','url',1], ['tags','タグ（空白区切り）','',1]
];
var cards = [], shots = {front:null, back:null}, editing = null, current = null, fromShot = false, isNew = false;
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'x'+Date.now()+Math.random().toString(16).slice(2)); }

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function busy(on,msg){ $('busy').classList.toggle('on',on); if(msg) $('busyMsg').textContent=msg; }
function show(v,title){
  ['setup','list','shot','edit','det'].forEach(function(n){ $('v-'+n).classList.toggle('on',n===v); });
  $('title').textContent = title||'名刺管理';
  $('backBtn').style.display = v==='list'?'none':'';
  $('fab').style.display = v==='list'?'':'none';
  window.scrollTo(0,0);
}
var ACTIONS = {listCards:'list', extractCard:'extract', saveCard:'save', deleteCard:'delete', discardImages:'discard', getImage:'image'};
function cfg(){ return { u: localStorage.getItem('meishi_u'), k: localStorage.getItem('meishi_k') }; }
function run(fn){ // Apps Script の API を呼ぶ（鍵つき POST。text/plain なので事前確認なしで届く）
  var args = Array.prototype.slice.call(arguments,1), c = cfg();
  return fetch(c.u, { method:'POST', body: JSON.stringify({ k:c.k, action:ACTIONS[fn], args:args }), redirect:'follow' })
    .then(function(r){ if(!r.ok) throw new Error('通信エラー '+r.status); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error); return j.data; })
    .catch(function(e){ if (e instanceof TypeError) throw new Error('つながりません。電波を確認してください'); throw e; });
}
function applyLink(str){
  var m = String(str).match(/#(.*)$/); if(!m) return false;
  var p = new URLSearchParams(m[1]), u = p.get('u'), k = p.get('k');
  if (!u || !k || !/^https:\/\/script\.google\.com\//.test(u)) return false;
  localStorage.setItem('meishi_u', u); localStorage.setItem('meishi_k', k);
  return true;
}
function setupFromText(){
  if (applyLink($('setupLink').value.trim())) { $('setupLink').value=''; start(); }
  else alert('リンクの形が違います。showLink() で出たリンク全体を貼ってください');
}
function start(){
  if (location.hash && applyLink(location.hash)) history.replaceState(null,'',location.pathname); // 鍵をアドレス欄・履歴に残さない
  var c = cfg();
  if (!c.u || !c.k) { show('setup','初回設定'); $('fab').style.display='none'; return; }
  show('list'); load();
}
function fail(e){ busy(false); alert('エラー：'+(e&&e.message||e)); }

/* 一覧 */
function load(){
  run('listCards').then(function(list){
    cards = list.sort(function(a,b){ return (b.exchanged+b.created).localeCompare(a.exchanged+a.created); });
    renderList();
  }).catch(fail);
}
function renderList(){
  var q = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var hit = cards.filter(function(c){
    var hay = [c.name,c.kana,c.company,c.department,c.title,c.email,c.tel,c.mobile,c.address,c.memo,c.tags,c.ocrText].join(' ').toLowerCase();
    var hayN = hay.replace(/[\s\-]/g,'');
    return q.every(function(w){ return hay.indexOf(w)>=0 || hayN.indexOf(w.replace(/-/g,''))>=0; });
  });
  $('count').textContent = cards.length + '件中 ' + hit.length + '件';
  $('list').innerHTML = hit.slice(0,300).map(function(c){
    return '<div class="item" onclick="openCard(\''+c.id+'\')"><div class="n">'+esc(c.name||'（氏名なし）')+
      ' <span class="d">'+esc(c.title)+'</span></div><div class="c">'+esc(c.company)+(c.department?' '+esc(c.department):'')+
      '</div><div class="d">'+esc(c.exchanged)+(c.memo?'　'+esc(c.memo.slice(0,30)):'')+'</div></div>';
  }).join('') || '<div class="count">該当なし</div>';
}
function goList(){ if(editing) cancelEdit(); else show('list'); }

/* 撮影 */
function goShot(){
  shots = {front:null, back:null};
  ['shotFront','shotBack'].forEach(function(id){ var im=$(id).querySelector('img'); if(im) im.remove(); });
  $('readBtn').disabled = true;
  show('shot','名刺を追加');
}
function pick(ev, side){
  var f = ev.target.files[0]; if(!f) return;
  resize(f,1600).then(function(dataUrl){
    shots[side] = dataUrl.split(',')[1];
    var box = $(side==='front'?'shotFront':'shotBack');
    var im = box.querySelector('img') || document.createElement('img');
    im.src = dataUrl; box.insertBefore(im, box.firstChild);
    $('readBtn').disabled = !shots.front;
  }).catch(fail);
}
function resize(file, max){
  return new Promise(function(ok,ng){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var s = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth*s); cv.height = Math.round(img.naturalHeight*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      var q = 0.85, d = cv.toDataURL('image/jpeg', q);
      while (d.length > 1500000 && q > 0.4) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); } // 約1.1MBまで
      ok(d);
    };
    img.onerror = function(){ ng(new Error('画像を読み込めません')); };
    img.src = url;
  });
}
function readCard(){
  busy(true,'読み取り中…（10〜20秒）');
  run('extractCard', shots.front, shots.back).then(function(r){
    busy(false); fromShot = true;
    openEdit(r.card, r.warning, r.duplicates);
  }).catch(fail);
}
function manualEntry(){
  fromShot = false;
  var d = new Date(); var t = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  openEdit({exchanged:t}, '', []);
}

/* 確認・編集 */
function openEdit(card, warning, dups){
  editing = Object.assign({}, card);
  isNew = !card.id;
  if (isNew) editing.id = uuid(); // 端末側で先にIDを振る→再送しても同じ行になる
  var notes = '';
  if (warning) notes += '<div class="note warn">'+esc(warning)+'</div>';
  if (dups && dups.length) notes += '<div class="note warn">同じ人が登録済みかもしれません：<br>'+
    dups.map(function(d){ return esc(d.name)+'（'+esc(d.company)+'・'+esc(d.exchanged)+'）'; }).join('<br>')+'</div>';
  if (fromShot && isNew) notes += '<div class="note info">読み取り結果です。間違いを直して保存してください。</div>';
  $('editNotes').innerHTML = notes;
  $('editImg').innerHTML = (fromShot && shots.front) ? '<img src="data:image/jpeg;base64,'+shots.front+'">' : '';
  if (editing.ocrText) $('editImg').innerHTML += '<details><summary>読み取った全文（コピーして欄に貼れます）</summary><pre style="white-space:pre-wrap;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;user-select:text">'+esc(editing.ocrText)+'</pre></details>';
  function fld(f){
    var v = esc(editing[f[0]]), t = f[2];
    var input = t==='area' ? '<textarea id="f_'+f[0]+'">'+v+'</textarea>'
      : '<input id="f_'+f[0]+'" type="'+(t==='date'?'date':t==='email'?'email':t==='tel'?'tel':t==='url'?'url':'text')+'" value="'+v+'">';
    return '<label class="f" for="f_'+f[0]+'">'+f[1]+'</label>'+input;
  }
  var main = FIELDS.filter(function(f){ return !f[3]; }), more = FIELDS.filter(function(f){ return f[3]; });
  var moreFilled = more.some(function(f){ return editing[f[0]]; });
  $('form').innerHTML = main.map(fld).join('') +
    '<details'+(moreFilled?' open':'')+'><summary>その他（ふりがな・FAX・住所・URL・タグ）</summary>'+more.map(fld).join('')+'</details>';
  show('edit', isNew ? '内容の確認' : '編集');
}
function save(){
  FIELDS.forEach(function(f){ editing[f[0]] = $('f_'+f[0]).value.trim(); });
  if (!editing.name && !editing.company) { alert('氏名か会社のどちらかは入れてください'); return; }
  busy(true,'保存中…');
  run('saveCard', editing).then(function(saved){
    busy(false);
    var i = cards.findIndex(function(c){ return c.id===saved.id; });
    if (i>=0) cards[i]=saved; else cards.unshift(saved);
    editing = null; fromShot = false; isNew = false;
    renderList(); openCard(saved.id);
  }).catch(function(e){ fail(new Error((e&&e.message||e)+'\n入力内容は残っています。電波のよい所で「保存する」をもう一度押してください（二重登録にはなりません）')); });
}
function cancelEdit(){
  if (editing && isNew && (editing.frontId||editing.backId)) {
    if (!confirm('保存せずに戻ります。撮った写真は消します。よろしいですか？')) return;
    run('discardImages', editing.frontId||'', editing.backId||'');
  }
  var id = editing && !isNew && editing.id; editing = null; fromShot = false; isNew = false;
  if (id) openCard(id); else show('list');
}

/* 詳細 */
function openCard(id){
  current = cards.find(function(c){ return c.id===id; }); if(!current) return;
  var c = current, rows = [];
  function tel(n){ return String(n).split('/').map(function(x){ x=x.trim(); return '<a href="tel:'+x.replace(/[^\d+]/g,'')+'">'+esc(x)+'</a>'; }).join(' / '); }
  if (c.tel) rows.push(['電話', tel(c.tel)]);
  if (c.mobile) rows.push(['携帯', tel(c.mobile)]);
  if (c.fax) rows.push(['FAX', esc(c.fax)]);
  if (c.email) rows.push(['メール', '<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>']);
  if (c.address) rows.push(['住所', '<a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.address)+'">'+(c.zip?'〒'+esc(c.zip)+' ':'')+esc(c.address)+'</a>']);
  if (c.url) rows.push(['URL', '<a target="_blank" href="'+(/^https?:/.test(c.url)?'':'https://')+esc(c.url)+'">'+esc(c.url)+'</a>']);
  rows.push(['交換日', esc(c.exchanged)]);
  if (c.memo) rows.push(['メモ', esc(c.memo).replace(/\n/g,'<br>')]);
  $('det').innerHTML = '<div class="kana">'+esc(c.kana)+'</div><h2>'+esc(c.name||'（氏名なし）')+'</h2>'+
    '<div class="co">'+esc(c.company)+'<br>'+esc(c.department)+' '+esc(c.title)+'</div>'+
    (c.tags ? '<div>'+c.tags.split(/\s+/).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('')+'</div>' : '')+
    '<div class="kv">'+rows.map(function(r){ return '<div><span class="k">'+r[0]+'</span>'+r[1]+'</div>'; }).join('')+'</div>';
  $('detImgs').innerHTML = (c.frontId||c.backId) ? '<div class="count">名刺画像を読み込み中…</div>' : '';
  show('det', '名刺');
  var ids = [c.frontId, c.backId].filter(Boolean);
  Promise.all(ids.map(function(fid){ return run('getImage', fid); })).then(function(urls){
    if (current !== c) return;
    $('detImgs').innerHTML = urls.map(function(u){ return '<img src="'+u+'">'; }).join('');
  }).catch(function(){ $('detImgs').innerHTML = '<div class="count">画像を開けませんでした</div>'; });
}
function editCurrent(){ fromShot = false; openEdit(current, '', []); }
function del(){
  if (!confirm(current.name+' さんの名刺を削除します。よろしいですか？')) return;
  busy(true,'削除中…');
  run('deleteCard', current.id).then(function(){
    busy(false); cards = cards.filter(function(c){ return c.id!==current.id; });
    renderList(); show('list');
  }).catch(fail);
}

/* vCard（スマホの連絡先へ） */
function vcard(){
  var c = current;
  function v(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1'); }
  var nm = String(c.name||'').split(/\s+/), km = String(c.kana||'').split(/\s+/);
  var L = ['BEGIN:VCARD','VERSION:3.0',
    'N:'+v(nm[0])+';'+v(nm.slice(1).join(' '))+';;;', 'FN:'+v(c.name||c.company)];
  if (c.kana) L.push('X-PHONETIC-LAST-NAME:'+v(km[0]), 'X-PHONETIC-FIRST-NAME:'+v(km.slice(1).join(' ')));
  if (c.company) L.push('ORG:'+v(c.company)+(c.department?';'+v(c.department):''));
  if (c.title) L.push('TITLE:'+v(c.title));
  String(c.tel||'').split('/').forEach(function(t){ if(t.trim()) L.push('TEL;TYPE=WORK,VOICE:'+t.trim()); });
  String(c.mobile||'').split('/').forEach(function(t){ if(t.trim()) L.push('TEL;TYPE=CELL:'+t.trim()); });
  if (c.fax) L.push('TEL;TYPE=WORK,FAX:'+c.fax);
  if (c.email) L.push('EMAIL;TYPE=WORK:'+c.email);
  if (c.address) L.push('ADR;TYPE=WORK:;;'+v(c.address)+';;;'+v(c.zip)+';');
  if (c.url) L.push('URL:'+c.url);
  if (c.memo) L.push('NOTE:'+v(c.memo));
  L.push('END:VCARD');
  var blob = new Blob([L.join('\r\n')], {type:'text/vcard'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (c.name||'contact').replace(/\s/g,'')+'.vcf';
  document.body.appendChild(a); a.click(); a.remove();
}

start();
window.addEventListener('hashchange', function(){ if (location.hash.indexOf('k=')>=0) start(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
